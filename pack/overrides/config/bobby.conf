# Delete regions from the cache when they have not been loaded for X days.
# Set to -1 to disable automatic cleanup.
delete-unused-regions-after-days=-1

# Keep separate caches for identically named worlds on multi-world servers.
dynamic-multi-world=false

# Enable Bobby's client-side cached chunk rendering.
enabled=true

# Maximum value exposed by Sodium's Render Distance slider.
max-render-distance=64

# Avoid ticking block entities in cached chunks.
no-block-entities=true

# Keep cached chunks visually identical to server-loaded chunks.
taint-fake-chunks=false

# Delay unloading chunks just outside the current render distance.
unload-delay-secs=60

# Bobby is used for multiplayer; do not override the integrated server.
view-distance-overwrite=0
